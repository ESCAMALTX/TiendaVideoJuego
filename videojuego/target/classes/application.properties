spring.application.name=videojuego

# ============================================================
#  MySQL (XAMPP / MySQL Workbench)
#  createDatabaseIfNotExist crea la base sola si no existe
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_videojuegos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
#  Servidor en http://localhost:8080
# ============================================================
server.port=8080

# Desactivar cache de plantillas en desarrollo
spring.thymeleaf.cache=false
